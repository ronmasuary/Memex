name: Release

# INERT SCAFFOLDING. Runs only when (a) a tag matching v* is pushed, or (b) someone manually
# starts it from the Actions tab. It never runs on ordinary pushes or PRs.
#
#  - Tag push:           verify, build, tarball, upload as workflow artifact, create a GitHub Release.
#  - workflow_dispatch:  verify, build, tarball, upload as workflow artifact ONLY (dry run;
#                        no Release is created, nothing is published).
#  - npm publish:        intentionally NOT wired live. The `publish-npm` job is skipped unless ALL of
#                        these hold: it is a v* tag run, repo variable NPM_PUBLISH_ENABLED == 'true',
#                        and secret NPM_TOKEN exists (it does not today). Memex is a private repo and
#                        is not published to npm; the owner decides when/if that changes.
#
# Tagging, publishing and making the repo public are the owner's manual decisions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build (server + web)
        run: npm run build:all

      - name: Package release tarball
        env:
          NAME: memex-${{ github.ref_name }}
        run: |
          NAME="${NAME//\//-}"
          mkdir -p "stage/$NAME" out
          cp -r dist "stage/$NAME/dist"
          mkdir -p "stage/$NAME/web"
          cp -r web/dist "stage/$NAME/web/dist"
          cp package.json package-lock.json README.md LICENSE "stage/$NAME/"
          tar -C stage -czf "out/$NAME.tar.gz" "$NAME"
          (cd out && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -l out

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: memex-release
          path: out/
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: build
    # Tag pushes only — a manual dispatch never creates a Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed only to create the Release
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: memex-release
          path: out

      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: out/*
          generate_release_notes: true
          draft: true # created as a draft; the owner reviews and publishes it by hand

  publish-npm:
    name: Publish to npm (NOT ENABLED)
    needs: build
    # Triple gate: tag run + explicit repo variable opt-in + a token must exist.
    # Today none of the opt-ins exist, so this job is always skipped.
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish # create this environment with required reviewers before enabling
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured; refusing to publish."
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # NOTE: package.json has no "files" allowlist yet — add one (dist, web/dist) before
      # enabling, or the package will include src/tests. Also the web build must ship in the pack.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --prefix web ci
          npm run build:web
          npm publish --provenance --access public
